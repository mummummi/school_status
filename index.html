<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>우리반 퀘스트보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 길드 게시판 — 왼쪽 메뉴 레일 + 넓은 작업 화면, 학생은 캐릭터 카드 격자 */
:root{
  --bg:#edf1f8; --panel:#ffffff; --sunk:#e3e9f4; --ink:#1b2342; --muted:#5a6486; --line:#d4dbea;
  --accent:#c9820a; --accent-soft:#fff1d2; --accent-ink:#ffffff;
  --exp:#2f63d8; --exp-soft:#dfe8ff; --good:#16895c; --good-soft:#d9f3e7; --bad:#cc3d3d; --bad-soft:#fde3e3;
  --g1:#6b7489; --g2:#1f8a57; --g3:#2d6fd6; --g4:#8448c9; --g5:#d06a0c;
  --night:#202a52; --night-ink:#f3f5ff;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:12px; --shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(20,30,70,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1328; --panel:#171d38; --sunk:#111631; --ink:#e7ebfb; --muted:#9aa3c6; --line:#29315a;
  --accent:#f0b03c; --accent-soft:#3a2f17; --accent-ink:#1b1405;
  --exp:#7499ff; --exp-soft:#1d2a57; --good:#3cc88e; --good-soft:#123528; --bad:#ff7171; --bad-soft:#3d1a1d;
  --g1:#9aa3b8; --g2:#46c788; --g3:#6c9cff; --g4:#b48af0; --g5:#f29a4a;
  --night:#0a0e22; --night-ink:#f3f5ff; color-scheme:dark;
  --shadow:0 1px 0 var(--line),0 8px 20px -14px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#0f1328; --panel:#171d38; --sunk:#111631; --ink:#e7ebfb; --muted:#9aa3c6; --line:#29315a;
  --accent:#f0b03c; --accent-soft:#3a2f17; --accent-ink:#1b1405;
  --exp:#7499ff; --exp-soft:#1d2a57; --good:#3cc88e; --good-soft:#123528; --bad:#ff7171; --bad-soft:#3d1a1d;
  --g1:#9aa3b8; --g2:#46c788; --g3:#6c9cff; --g4:#b48af0; --g5:#f29a4a;
  --night:#0a0e22; --night-ink:#f3f5ff; color-scheme:dark;
  --shadow:0 1px 0 var(--line),0 8px 20px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--exp);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--night);color:var(--night-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .crest{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:18px}
.brand h1{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;opacity:.7;font-family:var(--f-body)}
.top .spacer{flex:1}
.sync{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.1);white-space:nowrap}
.sync::before{content:"●";margin-right:6px;color:#7be0a8}
.sync.local::before{color:#ffcf6b}
.sync.saving::before{color:#9cc0ff}

/* shell */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;max-width:1360px;margin:0 auto;
  padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.rail .group{font-size:11px;letter-spacing:.12em;color:var(--muted);padding:12px 12px 4px}
nav.rail a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-family:var(--f-display);font-size:16px}
nav.rail a .ic{width:24px;text-align:center}
nav.rail a:hover{background:var(--sunk)}
nav.rail a[aria-current="page"]{background:var(--panel);box-shadow:var(--shadow);color:var(--exp)}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;scrollbar-width:thin}
  nav.rail .group{display:none}
  nav.rail a{white-space:nowrap;flex:none;font-size:15px}
}
main{min-width:0;display:flex;flex-direction:column;gap:18px}

/* panels */
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{font-size:24px}
.ph p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ph .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-family:var(--f-display);font-size:15px;line-height:1.2;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--exp);border-color:var(--exp);color:#fff}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.lg{padding:14px 26px;font-size:20px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:transparent;padding:4px 6px;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 7px;font-size:12px;font-family:var(--f-display);white-space:nowrap}
.tag.exp{background:var(--exp-soft);color:var(--exp)}
.tag.gold{background:var(--accent-soft);color:var(--accent)}
.tag.stat{background:var(--good-soft);color:var(--good)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.plain{background:var(--sunk);color:var(--muted)}
.grade{color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-family:var(--f-display)}
.subtabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:14px}
.subtabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-family:var(--f-display);font-size:15px;white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--panel);box-shadow:var(--shadow)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;color:var(--ink);font-size:15px;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 140px}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* notice */
.notice{background:var(--night);color:var(--night-ink);border-radius:var(--r);padding:18px 20px;display:flex;gap:16px;align-items:center}
.notice .bell{font-size:30px}
.notice .msg{flex:1;min-width:0;font-family:var(--f-display);font-size:22px;line-height:1.35;white-space:pre-wrap;word-break:keep-all}
.notice .msg.placeholder{opacity:.6;font-size:17px}
.notice .btn{background:transparent;color:var(--night-ink);border-color:rgba(255,255,255,.3)}

/* quest tiles */
.quests{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.quest{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:6px}
.quest:hover{border-color:var(--exp)}
.quest .q-top{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:16px}
.quest .q-top span:first-child{font-size:22px}
.quest .q-val{font-family:var(--f-display);font-size:24px}
.quest .q-val small{font-size:14px;color:var(--muted)}
.bar{height:7px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--exp);border-radius:99px}
.bar.gold>i{background:var(--accent)}
.bar.good>i{background:var(--good)}

/* student cards */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.hero{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative}
.hero:hover{border-color:var(--exp);transform:translateY(-1px)}
.hero .stage{height:96px;border-radius:10px;background:linear-gradient(180deg,var(--exp-soft),var(--sunk));display:grid;place-items:center;font-size:54px;position:relative}
.hero .lv{position:absolute;left:8px;top:8px;background:var(--night);color:var(--night-ink);font-family:var(--f-display);font-size:13px;border-radius:7px;padding:1px 7px}
.hero .no{position:absolute;right:8px;top:8px;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.hero .nm{font-family:var(--f-display);font-size:18px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .ttl{font-size:12px;min-height:18px}
.hero .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.rank-list{display:flex;flex-direction:column;gap:6px}
.rank-item{display:grid;grid-template-columns:44px 44px minmax(0,1fr) 90px 90px;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--sunk);text-align:left;border:0}
.rank-item .pos{font-family:var(--f-display);font-size:22px;text-align:center}
.rank-item .av{font-size:28px;text-align:center}
@media (max-width:520px){.rank-item{grid-template-columns:34px 34px minmax(0,1fr) 70px}.rank-item .hide-sm{display:none}}

/* cards (praise) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.pcard .pc-head{padding:12px 14px 6px;display:flex;gap:10px;align-items:flex-start}
.pcard .pc-emb{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:var(--accent-soft);flex:none}
.pcard.warn .pc-emb{background:var(--bad-soft)}
.pcard h4{font-size:17px;line-height:1.25}
.pcard .pc-desc{font-size:13px;color:var(--muted);margin-top:2px}
.pcard .pc-tags{padding:4px 14px 10px;display:flex;gap:4px;flex-wrap:wrap}
.pcard .pc-foot{margin-top:auto;display:flex;border-top:1px solid var(--line)}
.pcard .pc-foot button{flex:1;border:0;background:transparent;padding:10px;font-family:var(--f-display);font-size:15px}
.pcard .pc-foot button.go{background:var(--exp);color:#fff}
.pcard.warn .pc-foot button.go{background:var(--bad)}
.pcard .pc-foot button:not(.go):hover{background:var(--sunk)}

/* titles */
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.tcard .t-name{font-family:var(--f-display);font-size:20px}
.holders{display:flex;flex-wrap:wrap;gap:4px}
.holder{background:var(--sunk);border-radius:99px;padding:2px 8px;font-size:12px}

/* missions */
.mlist{display:flex;flex-direction:column;gap:10px}
.mission{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:start}
.mission .m-ic{width:48px;height:48px;border-radius:12px;background:var(--exp-soft);display:grid;place-items:center;font-size:24px}
.mission.challenge .m-ic{background:var(--accent-soft)}
.mission h4{font-size:18px}
.mission .m-desc{font-size:14px;color:var(--muted);margin:2px 0 8px;white-space:pre-wrap}
.mission .m-side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.done-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.done-pill{display:inline-flex;align-items:center;gap:4px;background:var(--good-soft);color:var(--good);border-radius:99px;padding:2px 4px 2px 9px;font-size:13px}
.done-pill button{border:0;background:transparent;color:inherit;padding:0 5px;border-radius:99px}
@media (max-width:600px){.mission{grid-template-columns:40px minmax(0,1fr)}.mission .m-side{grid-column:1/-1;flex-direction:row;align-items:center;flex-wrap:wrap}}

/* roles */
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.daybar .d{font-family:var(--f-display);font-size:20px;min-width:150px;text-align:center}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.role{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel)}
.role-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.role-h h4{font-size:18px;flex:1}
.member{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.member .mn{flex:1;min-width:0;font-family:var(--f-display)}
.seg{display:flex;gap:3px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 8px;font-size:13px;font-family:var(--f-display)}
.seg button[aria-pressed="true"][data-v="done"]{background:var(--exp);color:#fff;border-color:var(--exp)}
.seg button[aria-pressed="true"][data-v="bonus"]{background:var(--good);color:#fff;border-color:var(--good)}
.seg button[aria-pressed="true"][data-v="penalty"]{background:var(--bad);color:#fff;border-color:var(--bad)}

/* journal */
.diary{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:150px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--sunk)}
.drow .who{font-family:var(--f-display);font-size:16px;display:flex;gap:8px;align-items:center;min-width:0}
.drow .who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moods{display:flex;gap:2px;flex-wrap:wrap}
.moods button{border:2px solid transparent;background:transparent;font-size:22px;border-radius:10px;padding:0 3px;line-height:1.3}
.moods button[aria-pressed="true"]{border-color:var(--exp);background:var(--panel)}
.drow.saved{background:var(--good-soft)}
@media (max-width:760px){.drow{grid-template-columns:minmax(0,1fr) auto}.drow .moods,.drow .inp{grid-column:1/-1}}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.letter{background:var(--accent-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.letter .lt-to{font-family:var(--f-display);font-size:17px}
.letter .lt-body{white-space:pre-wrap}
.letter .lt-from{text-align:right;font-family:var(--f-display);color:var(--muted)}
.mood-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mood-summary span{background:var(--sunk);border-radius:10px;padding:4px 10px;font-family:var(--f-display)}

/* tools */
.stage-big{min-height:220px;border-radius:16px;background:var(--night);color:var(--night-ink);display:grid;place-items:center;text-align:center;padding:20px}
.stage-big .big{font-family:var(--f-display);font-size:clamp(40px,9vw,92px);line-height:1.1}
.stage-big .sub{opacity:.75;font-size:16px}
.pick-result{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pick-result span{font-family:var(--f-display);font-size:clamp(26px,5vw,44px);background:rgba(255,255,255,.1);border-radius:14px;padding:6px 18px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.team{border-radius:14px;padding:12px;background:var(--sunk)}
.team h4{font-size:19px;margin-bottom:6px}
.team div{font-family:var(--f-display);font-size:17px;padding:2px 0}
.timer-digits{font-family:var(--f-display);font-size:clamp(70px,16vw,170px);line-height:1;font-variant-numeric:tabular-nums}
.timer-digits.over{color:#ff8b8b}
.wheel-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
@media (max-width:760px){.wheel-wrap{grid-template-columns:minmax(0,1fr)}}
.wheel-box{position:relative;max-width:440px;width:100%;margin:0 auto}
.wheel-box canvas{width:100%;height:auto;display:block}
.wheel-box .pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--bad);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.talk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.talk-card{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--panel)}
.talk-card .tc-n{font-family:var(--f-display);font-size:17px}
.talk-card .tc-s{font-family:var(--f-display);font-size:34px;color:var(--exp)}
.seats-wrap{overflow-x:auto}
.board{background:var(--night);color:var(--night-ink);border-radius:10px;text-align:center;padding:8px;font-family:var(--f-display);margin-bottom:12px}
.seats{display:grid;gap:8px;min-width:max-content}
.seat{width:104px;height:70px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-size:15px}
.seat .sa{font-size:22px;line-height:1}
.seat.emptyseat{background:var(--sunk);color:var(--muted);border-style:dashed}
.seat.sel{outline:3px solid var(--accent)}

/* shop & bank */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.coupon{border:2px dashed var(--line);border-radius:14px;padding:14px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.coupon .cp-emo{font-size:34px}
.coupon h4{font-size:18px}
.coupon .price{font-family:var(--f-display);font-size:22px;color:var(--accent)}
.coupon.off{opacity:.55}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:400;color:var(--muted);font-size:12px;letter-spacing:.06em}
td.r,th.r{text-align:right}
.stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat-tile{background:var(--sunk);border-radius:12px;padding:12px}
.stat-tile b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px}
.stat-tile span{font-size:13px;color:var(--muted)}
.status{font-size:12px;border-radius:6px;padding:2px 8px;font-family:var(--f-display)}
.status.run{background:var(--exp-soft);color:var(--exp)}
.status.ready{background:var(--accent-soft);color:var(--accent)}
.status.done{background:var(--sunk);color:var(--muted)}

/* log */
.log{display:flex;flex-direction:column;gap:2px;font-size:14px}
.log div{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.log time{color:var(--muted);flex:none;width:92px;font-variant-numeric:tabular-nums}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,14,34,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:16px;width:min(680px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:20px;box-shadow:0 20px 60px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:14px}
.modal h3{font-size:22px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;position:sticky;bottom:-20px;background:var(--panel);padding:10px 0 0}
.modal-foot .grow{margin-right:auto;color:var(--muted);font-size:14px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pick{border:2px solid var(--line);border-radius:12px;background:var(--panel);padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-display)}
.pick .pa{font-size:28px}
.pick[aria-pressed="true"]{border-color:var(--exp);background:var(--exp-soft)}
.pick:disabled{opacity:.4}
.pick small{font-family:var(--f-body);font-size:11px;color:var(--muted)}
.avatars{display:flex;flex-wrap:wrap;gap:4px}
.avatars button{font-size:26px;border:2px solid transparent;background:var(--sunk);border-radius:10px;width:46px;height:46px}
.avatars button[aria-pressed="true"]{border-color:var(--exp)}
.prof{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center}
.prof .pav{height:110px;border-radius:16px;background:linear-gradient(180deg,var(--exp-soft),var(--sunk));display:grid;place-items:center;font-size:64px}
.statbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 18px}
.statbar{display:grid;grid-template-columns:62px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13px}
.statbar .bar>i{background:var(--good)}

/* toast + celebration */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--night);color:var(--night-ink);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px -10px rgba(0,0,0,.6);max-width:340px;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.levelup{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(10,14,34,.6);padding:16px}
.levelup .lu{background:var(--night);color:var(--night-ink);border:3px solid var(--accent);border-radius:22px;padding:28px 34px;text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.levelup .lu h3{font-size:44px;color:var(--accent)}
.levelup .lu p{font-family:var(--f-display);font-size:22px;margin:6px 0 0}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero:hover{transform:none}}
.welcome{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}

.welcome .panel h3{font-size:20px;margin-bottom:6px}
.hint{font-size:13px;color:var(--muted)}

/* ============ 상태 & 저장 ============ */
let S=emptyState();
let db=null,ref=null,downloads=null,dirty=false,writing=false,saveTimer=null,pendingRemote=null,cloud=false;
const LSK='class-quest-board-v1';
try{const raw=localStorage.getItem(LSK);if(raw)S=normalize(JSON.parse(raw))}catch(e){}

function normalize(d){const b=emptyState();const o=Object.assign(b,d||{});
  o.students=(o.students||[]).map(s=>Object.assign({exp:0,gold:0,stats:{},titles:[],equip:null,avatar:'🧙',name:'',no:0},s));
  o.bank=Object.assign({rate:10,days:7,deposits:[]},o.bank||{});
  o.seats=Object.assign({cols:6,order:[]},o.seats||{});
  o.roleReward=Object.assign(emptyState().roleReward,o.roleReward||{});
  o.questReward=Object.assign(emptyState().questReward,o.questReward||{});
  return o}

function setSync(kind,text){const el=document.getElementById('sync');el.className='sync '+kind;el.textContent=text}
function persist(){
  try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}
  if(!ref){setSync('local','이 브라우저에 저장됨');return}
  dirty=true;setSync('saving','저장 중…');
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);
}
async function flush(){
  if(!ref||writing)return;
  writing=true;dirty=false;
  try{await ref.set(JSON.parse(JSON.stringify(S)));setSync('','클라우드에 저장됨')}
  catch(e){setSync('local','저장 실패 · 이 브라우저에만 보관');console.warn(e)}
  writing=false;
  if(dirty){clearTimeout(saveTimer);saveTimer=setTimeout(flush,300)}
}
function applyRemote(data){
  const n=normalize(data);
  if(JSON.stringify(n)===JSON.stringify(S))return;
  if(document.querySelector('.overlay')){pendingRemote=n;return}
  S=n;try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}
  render();
}
async function connect(){
  if(!window.claude||!window.claude.use){setSync('local','이 브라우저에 저장됨');return}
  try{downloads=await window.claude.use('downloads')}catch(e){}
  try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){setSync('local','이 브라우저에 저장됨');return}
  ref=db.doc('classroom/state');
  let first=true;
  ref.onSnapshot(snap=>{
    cloud=true;
    if(first){first=false;
      if(!snap.exists){ if(S.students.length||S.cards.length) persist(); else setSync('','클라우드 연결됨'); return }
      setSync('','클라우드에 저장됨');
    }
    if(snap.exists&&!dirty&&!writing)applyRemote(snap.data());
  },err=>{setSync('local','연결 끊김 · 이 브라우저에 저장');ref=null});
}

const fmt=n=>Number(n||0).toLocaleString('ko-KR');
const pad=n=>String(n).padStart(2,'0');
function dateKey(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dateLabel(k){const d=new Date(k+'T00:00:00');return `${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`}
function shiftDate(k,n){const d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return dateKey(d)}
function timeLabel(t){const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const stu=id=>S.students.find(s=>s.id===id);
const sorted=()=>S.students.slice().sort((a,b)=>(a.no||0)-(b.no||0)||a.name.localeCompare(b.name));
const sname=s=>s?(s.name?`${s.no}번 ${s.name}`:`${s.no}번`):'(삭제된 학생)';
const short=s=>s?(s.name||`${s.no}번`):'?';
function levelOf(exp){let lv=1;while(lv<99&&exp>=50*lv*(lv+1))lv++;return lv}
function levelProg(exp){const lv=levelOf(exp);const base=50*(lv-1)*lv,need=lv*100;return{lv,cur:exp-base,need,pct:Math.min(100,Math.max(0,(exp-base)/need*100))}}
const titleOf=id=>S.titles.find(t=>t.id===id);
const gradeOf=k=>GRADES.find(g=>g.k===k)||GRADES[0];
function rewardTags(r){let h='';
  if(r.exp)h+=`<span class="tag ${r.exp<0?'bad':'exp'}">EXP ${r.exp>0?'+':''}${fmt(r.exp)}</span>`;
  if(r.gold)h+=`<span class="tag ${r.gold<0?'bad':'gold'}">골드 ${r.gold>0?'+':''}${fmt(r.gold)}</span>`;
  for(const k in (r.stats||{}))if(r.stats[k])h+=`<span class="tag stat">${k} ${r.stats[k]>0?'+':''}${r.stats[k]}</span>`;
  return h}
function rewardText(r){const p=[];if(r.exp)p.push(`EXP ${r.exp>0?'+':''}${r.exp}`);if(r.gold)p.push(`골드 ${r.gold>0?'+':''}${r.gold}`);
  for(const k in (r.stats||{}))if(r.stats[k])p.push(`${k}${r.stats[k]>0?'+':''}${r.stats[k]}`);return p.length?` (${p.join(', ')})`:''}
function addLog(text,sids){S.log.unshift({t:Date.now(),text,sids:sids||[]});if(S.log.length>400)S.log.length=400}

function grant(sids,r,reason,opts={}){
  const ups=[];
  sids.forEach(id=>{const s=stu(id);if(!s)return;const before=levelOf(s.exp);
    s.exp=Math.max(0,s.exp+(r.exp||0));s.gold=Math.max(0,s.gold+(r.gold||0));
    for(const k in (r.stats||{})){s.stats[k]=Math.max(0,(s.stats[k]||0)+r.stats[k])}
    const after=levelOf(s.exp);if(after>before)ups.push({s,after});});
  if(!opts.silent){
    const who=sids.length>3?`${short(stu(sids[0]))} 외 ${sids.length-1}명`:sids.map(i=>short(stu(i))).join(', ');
    addLog(`${who} · ${reason}${rewardText(r)}`,sids);
    toast(`${who}에게 ${reason}${rewardText(r)}`);
  }
  if(ups.length)celebrate(ups);
}
function commit(){persist();render()}

/* ============ 토스트 / 축하 / 모달 ============ */
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),3200)}
function celebrate(ups){
  const el=document.createElement('div');el.className='levelup';el.setAttribute('role','dialog');
  el.innerHTML=`<div class="lu"><div style="font-size:54px">${ups.map(u=>esc(u.s.avatar)).slice(0,5).join(' ')}</div><h3>LEVEL UP!</h3>${ups.map(u=>`<p>${esc(sname(u.s))} → Lv.${u.after}</p>`).join('')}<p class="muted" style="font-size:14px;margin-top:14px">아무 곳이나 누르면 닫혀요</p></div>`;
  el.addEventListener('click',()=>el.remove());document.body.appendChild(el);setTimeout(()=>el.remove(),4500)}

function openModal(html,{mount,onClose}={}){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  const box=ov.firstChild;let closed=false;
  const close=(fromCancel)=>{if(closed)return;closed=true;ov.remove();document.removeEventListener('keydown',onKey);
    if(fromCancel&&onClose)onClose();
    if(pendingRemote&&!document.querySelector('.overlay')){const p=pendingRemote;pendingRemote=null;S=p;render()}};
  const onKey=e=>{if(e.key==='Escape')close(true)};
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close(true)});
  box.addEventListener('click',e=>{if(e.target.closest('[data-close]'))close(true)});
  document.addEventListener('keydown',onKey);
  document.body.appendChild(ov);
  if(mount)mount(box,()=>close(false));
  const f=box.querySelector('input:not([type=hidden]),textarea,select');if(f)f.focus();
  return ()=>close(false);
}
function confirmBox(msg,okText='확인',danger=false){return new Promise(res=>{
  openModal(`<h3>${esc(msg)}</h3><div class="modal-foot"><button class="btn" data-close>취소</button><button class="btn ${danger?'danger':'primary'}" data-ok>${esc(okText)}</button></div>`,
  {onClose:()=>res(false),mount:(b,close)=>b.querySelector('[data-ok]').onclick=()=>{close();res(true)}})})}

function pickStudents({title,sub='',okText='확인',single=false,disabled=[],note={},preselect=[]}){
  return new Promise(res=>{
    if(!S.students.length){toast('먼저 학생을 추가해 주세요');res(null);return}
    const sel=new Set(preselect);
    openModal(`<div><h3>${esc(title)}</h3>${sub?`<p class="muted" style="margin:4px 0 0">${sub}</p>`:''}</div>
      ${single?'':`<div class="chips"><button class="chip" data-all>전체 선택</button><button class="chip" data-none>선택 해제</button></div>`}
      <div class="pick-grid">${sorted().map(s=>`<button class="pick" data-sid="${s.id}" aria-pressed="${sel.has(s.id)}" ${disabled.includes(s.id)?'disabled':''}><span class="pa">${esc(s.avatar)}</span>${esc(sname(s))}${note[s.id]?`<small>${esc(note[s.id])}</small>`:''}</button>`).join('')}</div>
      <div class="modal-foot"><span class="grow" data-count></span><button class="btn" data-close>취소</button><button class="btn primary" data-ok>${esc(okText)}</button></div>`,
    {onClose:()=>res(null),mount:(b,close)=>{
      const upd=()=>{b.querySelectorAll('.pick').forEach(p=>p.setAttribute('aria-pressed',sel.has(p.dataset.sid)));b.querySelector('[data-count]').textContent=single?'':`${sel.size}명 선택`;b.querySelector('[data-ok]').disabled=!sel.size};
      b.addEventListener('click',e=>{const p=e.target.closest('.pick');
        if(p&&!p.disabled){const id=p.dataset.sid;if(single){sel.clear();sel.add(id)}else sel.has(id)?sel.delete(id):sel.add(id);upd()}
        if(e.target.closest('[data-all]')){b.querySelectorAll('.pick:not(:disabled)').forEach(p=>sel.add(p.dataset.sid));upd()}
        if(e.target.closest('[data-none]')){sel.clear();upd()}});
      b.querySelector('[data-ok]').onclick=()=>{close();res([...sel])};upd();}});
  })}

async function giveTitle(tid,sidsIn){const t=titleOf(tid);if(!t)return;
  const holders=S.students.filter(s=>s.titles.includes(tid)).map(s=>s.id);
  const sids=sidsIn||await pickStudents({title:`👑 '${t.name}' 수여`,sub:rewardText(t)+' · 이미 가진 학생은 고를 수 없어요',okText:'수여하기',disabled:holders});
  if(!sids||!sids.length)return;
  sids.forEach(id=>{const s=stu(id);if(s&&!s.titles.includes(tid)){s.titles.push(tid);s.equip=tid}});
  grant(sids,t,`칭호 '${t.name}' 획득`);if(!sidsIn)commit()}
async function revokeTitle(tid){const t=titleOf(tid);const holders=S.students.filter(s=>s.titles.includes(tid));
  const sids=await pickStudents({title:`'${t.name}' 회수`,sub:'보상으로 받은 EXP·골드는 그대로 두어요.',okText:'회수',disabled:S.students.filter(s=>!s.titles.includes(tid)).map(s=>s.id)});
  if(!sids||!sids.length)return;sids.forEach(id=>{const s=stu(id);s.titles=s.titles.filter(x=>x!==tid);if(s.equip===tid)s.equip=s.titles[s.titles.length-1]||null});
  addLog(`칭호 '${t.name}' 회수: ${sids.map(i=>short(stu(i))).join(', ')}`,sids);commit()}

async function missionDone(mid){const m=S.missions.find(x=>x.id===mid);if(!m)return;
  const disabled=m.repeat?[]:Object.keys(m.done||{});const note={};for(const k in m.done)note[k]=m.repeat?`${m.done[k]}회 완료`:'완료';
  const sids=await pickStudents({title:`${m.emoji||''} ${m.name}`,sub:'완료한 학생을 고르세요'+rewardText(m),okText:'완료 처리',disabled,note});
  if(!sids||!sids.length)return;m.done=m.done||{};sids.forEach(id=>m.done[id]=(m.done[id]||0)+1);
  grant(sids,m,`${m.type==='challenge'?'챌린지':'미션'} '${m.name}' 완료`);
  if(m.titleId){const fresh=sids.filter(id=>!stu(id).titles.includes(m.titleId));if(fresh.length)giveTitle(m.titleId,fresh)}
  commit()}

  addLog(`${short(stu(sid))} · '${m.name}' 완료 취소`,[sid]);toast('완료를 취소하고 보상을 되돌렸어요');commit()}

    ${S.roles.length?`<div class="roles">${S.roles.map(r=>`<div class="role"><div class="role-h"><span style="font-size:22px">${esc(r.emoji||'🧹')}</span><h4>${esc(r.name)}</h4><button class="btn sm" data-act="role-assign" data-id="${r.id}">담당</button><button class="icon-btn" data-act="role-edit" data-id="${r.id}" aria-label="수정">✎</button></div>
      ${r.desc?`<div class="hint" style="margin-bottom:4px">${esc(r.desc)}</div>`:''}
      ${r.members.filter(stu).length?r.members.filter(stu).map(sid=>{const v=day[r.id+':'+sid];const s=stu(sid);return `<div class="member"><span style="font-size:20px">${esc(s.avatar)}</span><span class="mn">${esc(sname(s))}</span><span class="seg">${[['done','수행'],['bonus','보너스'],['penalty','패널티']].map(([k,t])=>`<button data-act="role-check" data-rid="${r.id}" data-sid="${sid}" data-v="${k}" aria-pressed="${v===k}">${t}</button>`).join('')}</span></div>`}).join(''):'<div class="hint member">담당 학생이 없어요</div>'}
    </div>`).join('')}</div>`:'<div class="empty">역할이 없어요.</div>'}
  </section>`};
function roleCheck(rid,sid,v){const d=ui.roleDate;S.roleLog[d]=S.roleLog[d]||{};const key=rid+':'+sid;const old=S.roleLog[d][key];const rr=S.roleReward;const r=S.roles.find(x=>x.id===rid);
  if(old){const o=rr[old];grant([sid],{exp:-o.exp,gold:-o.gold},'',{silent:true})}
  if(old===v){delete S.roleLog[d][key];toast('체크를 취소했어요')}
  else{S.roleLog[d][key]=v;grant([sid],rr[v],`1인1역 '${r?r.name:''}' ${({done:'수행',bonus:'보너스',penalty:'패널티'})[v]}`)}
  if(!Object.keys(S.roleLog[d]).length)delete S.roleLog[d];commit()}
async function roleAssign(rid){const r=S.roles.find(x=>x.id===rid);const note={};S.roles.forEach(x=>x.members.forEach(m=>{if(x.id!==rid)note[m]=x.name}));
  const sids=await pickStudents({title:`${r.emoji||''} ${r.name} 담당`,sub:'다른 역할을 맡은 학생도 고를 수 있어요.',okText:'저장',preselect:r.members,note});if(sids===null)return;r.members=sids;commit()}
async function roleRandom(){if(!S.roles.length||!S.students.length)return;if(!await confirmBox('모든 역할의 담당을 랜덤으로 다시 정할까요?','랜덤 배정'))return;
  S.roles.forEach(r=>r.members=[]);shuffle(S.students).forEach((s,i)=>S.roles[i%S.roles.length].members.push(s.id));addLog('1인1역 랜덤 배정');commit()}
function roleForm(rid){const r=rid?S.roles.find(x=>x.id===rid):{emoji:'🧹',name:'',desc:'',members:[]};
  openModal(`<h3>${rid?'역할 수정':'역할 추가'}</h3><div class="row"><label class="f" style="flex:0 1 80px">아이콘<input class="inp" id="r-emo" value="${esc(r.emoji)}" maxlength="4"></label><label class="f" style="flex:2 1 200px">역할 이름<input class="inp" id="r-name" value="${esc(r.name)}"></label></div><label class="f">하는 일<input class="inp" id="r-desc" value="${esc(r.desc)}"></label>
    <div class="modal-foot">${rid?'<button class="btn danger" data-del>삭제</button>':''}<span class="grow"></span><button class="btn" data-close>취소</button><button class="btn primary" data-ok>저장</button></div>`,
  {mount:(b,close)=>{b.querySelector('[data-ok]').onclick=()=>{const name=b.querySelector('#r-name').value.trim();if(!name)return;const d={name,emoji:b.querySelector('#r-emo').value.trim(),desc:b.querySelector('#r-desc').value.trim()};
      if(rid)Object.assign(r,d);else S.roles.push(Object.assign({id:uid(),members:[]},d));close();commit()};
    const del=b.querySelector('[data-del]');if(del)del.onclick=async()=>{close();if(await confirmBox(`'${r.name}' 역할을 삭제할까요?`,'삭제',true)){S.roles=S.roles.filter(x=>x.id!==rid);commit()}}}});

      <label class="f" style="margin-top:10px">편지 내용<textarea class="inp" id="l-text" placeholder="고마웠던 일을 적어 보세요"></textarea></label>

AFTER.journal=m=>{m.querySelectorAll('.drow').forEach(row=>row.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{row.querySelectorAll('[data-mood]').forEach(x=>x.setAttribute('aria-pressed',x===b));row.dataset.mood=b.dataset.mood}))};
function diarySave(sid,row){const d=ui.journalDate;const sel=row.querySelector('[data-mood][aria-pressed="true"]');const text=row.querySelector('input').value.trim();
  if(!sel){toast('기분을 먼저 골라 주세요');return}
  let e=S.diary.find(x=>x.date===d&&x.sid===sid);
  if(e){e.mood=sel.dataset.mood;e.text=text;toast('마음일기를 고쳤어요')}
  else{S.diary.push({id:uid(),date:d,sid,mood:sel.dataset.mood,text});grant([sid],S.questReward.diary,'마음일기 작성')}
  if(S.diary.length>3000)S.diary=S.diary.slice(-3000);commit()}
function letterSave(){const from=document.getElementById('l-from').value,to=document.getElementById('l-to').value,text=document.getElementById('l-text').value.trim();
  if(!from||!to||!text){toast('보내는 사람, 받는 사람, 내용을 모두 채워 주세요');return}
  if(from===to){toast('자기 자신에게는 보낼 수 없어요');return}
  const d=ui.journalDate;const first=!S.letters.some(l=>l.date===d&&l.from===from);
  S.letters.push({id:uid(),date:d,from,to,text});if(S.letters.length>2000)S.letters=S.letters.slice(-2000);
  if(first)grant([from],S.questReward.letter,`감사 편지 (To. ${to==='teacher'?'선생님':short(stu(to))})`);else{addLog(`${short(stu(from))} · 감사 편지`,[from]);toast('편지를 보냈어요')}

AFTER.tools=()=>{if(ui.toolTab==='wheel')drawWheel()};
function doPick(k){if(tool.pickBusy)return;let pool=S.students.filter(s=>!tool.picked.includes(s.id));if(!pool.length){toast('모두 뽑혔어요. 처음부터를 눌러 주세요');return}
  k=Math.min(k,pool.length);const chosen=shuffle(pool).slice(0,k).map(s=>s.id);const stage=document.getElementById('pick-stage');tool.pickBusy=true;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let i=0;
  const iv=setInterval(()=>{const r=shuffle(pool).slice(0,k);stage.innerHTML=`<div class="pick-result">${r.map(s=>`<span>${esc(s.avatar)} ${esc(short(s))}</span>`).join('')}</div>`;if(++i>14){clearInterval(iv);finish()}},reduce?1:80);
  function finish(){tool.pickBusy=false;tool.last=chosen;tool.picked.push(...chosen);render()}}
function makeTeams(k){const arr=shuffle(S.students.map(s=>s.id));const t=Array.from({length:k},()=>[]);arr.forEach((id,i)=>t[i%k].push(id));tool.teams=t;render()}
function tmText(){const l=Math.max(0,Math.ceil(tool.tm.left));return pad(Math.floor(l/60))+':'+pad(l%60)}
function tmTick(){const tm=tool.tm;tm.left=(tm.end-Date.now())/1000;
  if(tm.left<=0){tm.left=0;tm.running=false;clearInterval(tm.iv);beep();if(view==='tools'&&ui.toolTab==='timer')render();toast('⏰ 시간 끝!');return}
  const d=document.getElementById('tm-digits'),b=document.getElementById('tm-bar');if(d)d.textContent=tmText();if(b)b.style.width=(tm.left/tm.total*100)+'%'}
function beep(){if(!audioCtx)return;const t=audioCtx.currentTime;[0,0.35,0.7].forEach(o=>{const os=audioCtx.createOscillator(),g=audioCtx.createGain();os.frequency.value=880;os.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.25,t+o);g.gain.exponentialRampToValueAtTime(.001,t+o+.3);os.start(t+o);os.stop(t+o+.3)})}
function wheelColors(){const cs=getComputedStyle(document.documentElement);return['--exp','--accent','--good','--g4','--bad','--g5','--g3','--g2'].map(v=>cs.getPropertyValue(v).trim()||'#888')}
function drawWheel(){const c=document.getElementById('wheel');if(!c)return;const x=c.getContext('2d');const items=tool.wheel.items.length?tool.wheel.items:['항목을 넣어 주세요'];const n=items.length,R=350,cx=360,cy=360,seg=Math.PI*2/n,cols=wheelColors();
  x.clearRect(0,0,720,720);items.forEach((it,i)=>{const a=tool.wheel.rot+i*seg;x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,R,a,a+seg);x.closePath();x.fillStyle=cols[i%cols.length];if(n%cols.length===1&&i===n-1&&n>1)x.fillStyle=cols[1];x.fill();x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=3;x.stroke();
    x.save();x.translate(cx,cy);x.rotate(a+seg/2);x.textAlign='right';x.fillStyle='#fff';x.font=`${n>20?22:30}px Jua, sans-serif`;x.fillText(String(it).slice(0,10),R-22,10);x.restore()});
  x.beginPath();x.arc(cx,cy,36,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.strokeStyle='rgba(0,0,0,.15)';x.stroke()}
function spinWheel(){const w=tool.wheel;if(w.spinning||!w.items.length)return;w.spinning=true;w.result='';const res=document.getElementById('wheel-result');if(res)res.textContent='';
  const start=w.rot,delta=Math.PI*2*(6+Math.random()*4)+Math.random()*Math.PI*2,dur=matchMedia('(prefers-reduced-motion: reduce)').matches?10:4200,t0=performance.now();
  const step=now=>{const p=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-p,4);w.rot=start+delta*e;drawWheel();
    if(p<1)requestAnimationFrame(step);else{w.spinning=false;const n=w.items.length,seg=Math.PI*2/n;let a=(-Math.PI/2-w.rot)%(Math.PI*2);if(a<0)a+=Math.PI*2;w.result='🎉 '+w.items[Math.floor(a/seg)%n];const r=document.getElementById('wheel-result');if(r)r.textContent=w.result}};
  requestAnimationFrame(step)}
function seatOrder(){const cols=S.seats.cols;let o=(S.seats.order||[]).filter(id=>id===null||stu(id));S.students.forEach(s=>{if(!o.includes(s.id)){const e=o.indexOf(null);if(e>=0)o[e]=s.id;else o.push(s.id)}});
  const need=Math.max(cols,Math.ceil(o.length/cols)*cols);while(o.length<need)o.push(null);while(o.length>need&&o[o.length-1]===null)o.pop();S.seats.order=o;return o}

    case 'student-edit':editStudent(sid);break;
    case 'add-students':addStudentsBulk();break;
    case 'load-preset':{const p=starterPreset();S.cards.push(...p.cards);S.titles.push(...p.titles);S.missions.push(...p.missions);S.coupons.push(...p.coupons);S.roles.push(...p.roles);addLog('기본 세트를 불러왔어요');toast('기본 세트를 불러왔어요');commit();break}
    case 'edit-notice':openModal(`<h3>📣 알림 메시지</h3><textarea class="inp" id="notice-t" rows="4" placeholder="예: 오늘은 3교시에 강당으로 이동해요!">${esc(S.notice)}</textarea><div class="modal-foot"><button class="btn" data-clear>지우기</button><span class="grow"></span><button class="btn" data-close>취소</button><button class="btn primary" data-ok>게시</button></div>`,
      {mount:(b,close)=>{b.querySelector('[data-ok]').onclick=()=>{S.notice=b.querySelector('#notice-t').value.trim();close();commit()};b.querySelector('[data-clear]').onclick=()=>{S.notice='';close();commit()}}});break;
    case 'home-mode':ui.homeMode=v;render();break;
    case 'quick-card':quickCard();break;
    case 'quick-gold':quickGold();break;
    case 'praise-kind':ui.praiseKind=v;ui.praiseCat='전체';render();break;
    case 'praise-cat':ui.praiseCat=v;render();break;
    case 'card-give':giveCard(id);break;
    case 'card-edit':cardForm(id);break;
    case 'custom-praise':customPraise();break;
    case 'title-edit':titleForm(id);break;
    case 'title-give':giveTitle(id);break;
    case 'title-revoke':revokeTitle(id);break;
    case 'mission-edit':missionForm(id);break;
    case 'mission-done':missionDone(id);break;
    case 'mission-undo':missionUndo(id,sid);break;
    case 'mission-toggle':{const m=S.missions.find(x=>x.id===id);m.active=!m.active;commit();break}
    case 'mission-ended':ui.missionShowEnded=!ui.missionShowEnded;render();break;
    case 'role-day':ui.roleDate=v==='0'?dateKey():shiftDate(ui.roleDate,+v);render();break;
    case 'role-check':roleCheck(el.dataset.rid,sid,v);break;
    case 'role-assign':roleAssign(id);break;
    case 'role-edit':roleForm(id);break;
    case 'role-random':roleRandom();break;
    case 'journal-tab':ui.journalTab=v;render();break;
    case 'journal-day':ui.journalDate=v==='0'?dateKey():shiftDate(ui.journalDate,+v);render();break;
    case 'diary-save':diarySave(sid,el.closest('.drow'));break;
    case 'letter-save':letterSave();break;
    case 'letter-del':if(await confirmBox('이 편지를 삭제할까요?','삭제',true)){S.letters=S.letters.filter(l=>l.id!==id);commit()}break;
    case 'tool-tab':ui.toolTab=v;render();break;
    case 'pick':doPick(+v);break;
    case 'pick-reset':tool.picked=[];tool.last=[];render();break;
    case 'team':makeTeams(+v);break;
    case 'tm-set':{const tm=tool.tm;clearInterval(tm.iv);tm.running=false;tm.total=tm.left=+v;render();break}
    case 'tm-custom':{const tm=tool.tm;clearInterval(tm.iv);tm.running=false;tm.total=tm.left=Math.max(1,(+document.getElementById('tm-m').value||0)*60+(+document.getElementById('tm-s').value||0));render();break}
    case 'tm-toggle':{const tm=tool.tm;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume()}catch(_){}
      if(tm.running){tm.running=false;clearInterval(tm.iv)}else{if(tm.left<=0)tm.left=tm.total;tm.end=Date.now()+tm.left*1000;tm.running=true;clearInterval(tm.iv);tm.iv=setInterval(tmTick,200)}render();break}
    case 'tm-reset':{const tm=tool.tm;clearInterval(tm.iv);tm.running=false;tm.left=tm.total;render();break}
    case 'wheel-spin':spinWheel();break;
    case 'wheel-apply':tool.wheel.items=document.getElementById('wheel-items').value.split('\n').map(x=>x.trim()).filter(Boolean);tool.wheel.rot=0;drawWheel();break;
    case 'wheel-students':tool.wheel.items=sorted().map(short);render();break;
    case 'talk':S.talk[sid]=Math.max(0,(S.talk[sid]||0)+(+v));commit();break;
    case 'talk-reset':if(await confirmBox('발표 점수를 모두 0으로 비울까요?','비우기',true)){S.talk={};commit()}break;
    case 'talk-settle':{const ids=Object.keys(S.talk).filter(k=>S.talk[k]>0&&stu(k));if(!ids.length){toast('정산할 점수가 없어요');break}
      if(!await confirmBox(`발표 점수를 골드로 바꿀까요? (1점 = ${S.talkGold}G) 정산 후 점수는 0이 돼요.`,'정산'))break;
      ids.forEach(k=>{stu(k).gold+=S.talk[k]*S.talkGold});addLog(`발표 점수 정산: ${ids.map(k=>`${short(stu(k))} ${S.talk[k]*S.talkGold}G`).join(', ')}`,ids);S.talk={};toast('발표 점수를 골드로 정산했어요');commit();break}
    case 'seat':{const i=+v;if(tool.seatSel===null){tool.seatSel=i;render()}else{const o=S.seats.order;[o[tool.seatSel],o[i]]=[o[i],o[tool.seatSel]];tool.seatSel=null;commit()}break}
    case 'seat-shuffle':{const ids=shuffle(S.students.map(s=>s.id));S.seats.order=ids;tool.seatSel=null;addLog('자리 배치를 새로 섞었어요');commit();break}
    case 'seat-cols':S.seats.cols=Math.min(10,Math.max(2,+document.getElementById('seat-cols').value||6));S.seats.order=S.seats.order.filter(Boolean);commit();break;
    case 'shop-tab':ui.shopTab=v;render();break;
    case 'buy':buyCoupon(id);break;
    case 'coupon-use':useCoupon(id);break;
    case 'coupon-edit':couponForm(id);break;
    case 'deposit':deposit();break;
    case 'claim':claimDep(id);break;
    case 'claim-now':if(await confirmBox('지금 바로 만기 처리하고 이자까지 줄까요?','만기 처리'))claimDep(id);break;
    case 'cancel-dep':if(await confirmBox('중도해지하면 원금만 돌려줘요. 진행할까요?','중도해지',true))claimDep(id,'cancel');break;
    case 'bank-save':S.bank.rate=Math.min(50,Math.max(1,+document.getElementById('b-rate').value||10));S.bank.days=Math.min(60,Math.max(1,+document.getElementById('b-days').value||7));toast('이자율을 저장했어요. 새로 맺는 저축부터 적용돼요');commit();break;
    case 'settings-save':{S.className=document.getElementById('set-name').value.trim()||'우리반';S.talkGold=Math.max(0,+document.getElementById('set-talk').value||0);
      document.querySelectorAll('[data-qr]').forEach(i=>{const[k,f]=i.dataset.qr.split('.');S.questReward[k][f]=+i.value||0});
      document.querySelectorAll('[data-rr]').forEach(i=>{const[k,f]=i.dataset.rr.split('.');S.roleReward[k][f]=+i.value||0});toast('설정을 저장했어요');commit();break}
    case 'export':{const data=JSON.stringify(S,null,1);const fn=`퀘스트보드-백업-${dateKey()}.json`;
      if(downloads){try{await downloads.save({filename:fn,data});toast('백업 파일을 저장했어요')}catch(err){toast('저장을 취소했거나 저장할 수 없어요')}}
      else{openModal(`<h3>백업 데이터</h3><p class="hint" style="margin:0">이 화면에서는 파일로 바로 받을 수 없어요. 아래 내용을 전부 복사해서 메모장에 .json으로 저장해 두세요.</p><textarea class="inp" rows="10" readonly id="bk">${esc(data)}</textarea><div class="modal-foot"><button class="btn" data-copy>복사</button><button class="btn primary" data-close>닫기</button></div>`,
        {mount:b=>b.querySelector('[data-copy]').onclick=()=>{const t=b.querySelector('#bk');navigator.clipboard.writeText(t.value).then(()=>toast('복사했어요'),()=>{t.select();toast('선택된 내용을 Ctrl+C로 복사하세요')})}})}
      break}
    case 'import':document.getElementById('import-file').click();break;
    case 'season-reset':if(await confirmBox('학생 명단만 남기고 EXP·골드·칭호·기록을 모두 0으로 되돌릴까요?','초기화',true)){S.students.forEach(s=>Object.assign(s,{exp:0,gold:0,stats:{},titles:[],equip:null}));S.missions.forEach(m=>m.done={});Object.assign(S,{roleLog:{},owned:[],diary:[],letters:[],talk:{},log:[]});S.bank.deposits=[];commit()}break;
    case 'wipe':if(await confirmBox('학생과 모든 설정·기록을 지울까요? 되돌릴 수 없어요.','모두 지우기',true)){const keep=S.className;S=emptyState();S.className=keep;commit()}break;
  }
});
document.getElementById('import-file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.students))throw 0;if(await confirmBox(`백업(학생 ${d.students.length}명)으로 지금 데이터를 바꿀까요?`,'불러오기',true)){S=normalize(d);toast('백업을 불러왔어요');commit()}}catch(_){toast('올바른 백업 파일이 아니에요')}e.target.value=''};r.readAsText(f)});

route();
connect();
</script>

</body></html>
